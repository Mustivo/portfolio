<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bg-mesh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05101e" />
      <stop offset="50%" stop-color="#0c203a" />
      <stop offset="100%" stop-color="#08182b" />
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#bg-mesh)" />

  <g transform="translate(80, 60)">
    <rect width="1040" height="580" rx="16" fill="#0b1b30" stroke="#1d4ed8" stroke-width="1.5" />
    
    <!-- Top Bar -->
    <path d="M 0 16 C 0 7.163 7.163 0 16 0 L 1024 0 C 1032.837 0 1040 7.163 1040 16 L 1040 50 L 0 50 Z" fill="#071220" />
    <circle cx="30" cy="25" r="6" fill="#ef4444" />
    <circle cx="50" cy="25" r="6" fill="#f59e0b" />
    <circle cx="70" cy="25" r="6" fill="#10b981" />
    <rect x="120" y="14" width="380" height="22" rx="6" fill="#122a4d" stroke="#2563eb" stroke-width="1" />
    <text x="140" y="29" font-family="sans-serif" font-size="11" fill="#93c5fd">https://pulsemesh.internal/topology-graph</text>
    
    <!-- Header status -->
    <text x="980" y="32" text-anchor="end" font-family="sans-serif" font-size="12" fill="#22c55e" font-weight="bold">● 1,024 Edge Probes Alive</text>

    <!-- Global Network Map Visualization Canvas -->
    <g transform="translate(40, 80)">
      <rect width="960" height="450" rx="12" fill="#061324" stroke="#1e3a5f" stroke-width="1" />

      <!-- Network Nodes & Connecting Arcs -->
      <g stroke="#38bdf8" stroke-width="1.5" opacity="0.4" fill="none">
        <path d="M 180 200 Q 320 120 450 180 T 720 220 T 880 160" />
        <path d="M 220 320 Q 380 380 540 280 T 800 320" />
        <path d="M 180 200 L 220 320" />
        <path d="M 450 180 L 540 280" />
        <path d="M 720 220 L 800 320" />
        <path d="M 880 160 L 800 320" />
      </g>

      <!-- Pulse Nodes -->
      <!-- US-East -->
      <circle cx="180" cy="200" r="14" fill="#38bdf8" fill-opacity="0.2" />
      <circle cx="180" cy="200" r="6" fill="#38bdf8" />
      <text x="180" y="230" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">US-East (N. Virginia)</text>
      <text x="180" y="245" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#22c55e">12ms · 0% loss</text>

      <!-- US-West -->
      <circle cx="220" cy="320" r="14" fill="#38bdf8" fill-opacity="0.2" />
      <circle cx="220" cy="320" r="6" fill="#38bdf8" />
      <text x="220" y="350" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">US-West (Oregon)</text>
      <text x="220" y="365" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#22c55e">24ms · 0% loss</text>

      <!-- EU-Central -->
      <circle cx="450" cy="180" r="14" fill="#38bdf8" fill-opacity="0.2" />
      <circle cx="450" cy="180" r="6" fill="#38bdf8" />
      <text x="450" y="210" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">EU-Central (Frankfurt)</text>
      <text x="450" y="225" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#22c55e">18ms · 0% loss</text>

      <!-- AP-South -->
      <circle cx="540" cy="280" r="14" fill="#38bdf8" fill-opacity="0.2" />
      <circle cx="540" cy="280" r="6" fill="#38bdf8" />
      <text x="540" y="310" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">AP-South (Mumbai)</text>
      <text x="540" y="325" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#22c55e">42ms · 0% loss</text>

      <!-- AP-Southeast -->
      <circle cx="720" cy="220" r="14" fill="#38bdf8" fill-opacity="0.2" />
      <circle cx="720" cy="220" r="6" fill="#38bdf8" />
      <text x="720" y="250" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">AP-East (Tokyo)</text>
      <text x="720" y="265" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#22c55e">35ms · 0% loss</text>

      <!-- AP-Australia -->
      <circle cx="800" cy="320" r="14" fill="#38bdf8" fill-opacity="0.2" />
      <circle cx="800" cy="320" r="6" fill="#38bdf8" />
      <text x="800" y="350" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">AU-East (Sydney)</text>
      <text x="800" y="365" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#22c55e">58ms · 0% loss</text>

      <!-- SA-East -->
      <circle cx="880" cy="160" r="14" fill="#38bdf8" fill-opacity="0.2" />
      <circle cx="880" cy="160" r="6" fill="#38bdf8" />
      <text x="880" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">SA-East (São Paulo)</text>
      <text x="880" y="205" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#22c55e">64ms · 0% loss</text>

      <!-- Bottom Status Strip -->
      <rect x="20" y="390" width="920" height="40" rx="8" fill="#0d233f" stroke="#1d4ed8" stroke-width="1" />
      <text x="40" y="415" font-family="sans-serif" font-size="12" fill="#93c5fd">WebSocket Frame Throughput: <tspan fill="#38bdf8" font-weight="bold">60.2 FPS</tspan> | Ping Interval: <tspan fill="#38bdf8" font-weight="bold">500ms</tspan> | Global Median RTT: <tspan fill="#22c55e" font-weight="bold">28.4ms</tspan></text>
    </g>
  </g>
</svg>
