<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bg-ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514" />
      <stop offset="50%" stop-color="#140c24" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>
    <linearGradient id="ai-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#bg-ai)" />
  
  <!-- Subtle circular grid -->
  <circle cx="600" cy="350" r="400" stroke="#7e22ce" stroke-width="1" fill="none" opacity="0.15" />
  <circle cx="600" cy="350" r="240" stroke="#c084fc" stroke-width="1" fill="none" opacity="0.15" />

  <g transform="translate(80, 60)">
    <rect width="1040" height="580" rx="16" fill="#181126" stroke="#4c1d95" stroke-width="1.5" />
    
    <!-- Top Bar -->
    <path d="M 0 16 C 0 7.163 7.163 0 16 0 L 1024 0 C 1032.837 0 1040 7.163 1040 16 L 1040 50 L 0 50 Z" fill="#0d0915" />
    <circle cx="30" cy="25" r="6" fill="#ef4444" />
    <circle cx="50" cy="25" r="6" fill="#f59e0b" />
    <circle cx="70" cy="25" r="6" fill="#10b981" />
    <rect x="120" y="14" width="400" height="22" rx="6" fill="#24163d" stroke="#581c87" stroke-width="1" />
    <text x="140" y="29" font-family="sans-serif" font-size="11" fill="#d8b4fe">https://cloudscale.ai/workspace/prompt-chain-v4</text>
    
    <!-- Model badge top right -->
    <rect x="880" y="15" width="130" height="22" rx="4" fill="#9333ea" fill-opacity="0.3" stroke="#a855f7" stroke-width="1" />
    <text x="945" y="30" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#f3e8ff" font-weight="bold">✦ GPT-4o vs Claude 3.5</text>

    <!-- Split Screen Left Model (Claude 3.5 Sonnet) -->
    <g transform="translate(30, 75)">
      <rect width="475" height="470" rx="10" fill="#120c1d" stroke="#3b1d5a" stroke-width="1" />
      <rect x="15" y="15" width="140" height="26" rx="6" fill="#6d28d9" fill-opacity="0.3" stroke="#a855f7" stroke-width="1" />
      <text x="25" y="32" font-family="sans-serif" font-size="12" font-weight="bold" fill="#e9d5ff">Claude 3.5 Sonnet</text>
      <text x="450" y="32" text-anchor="end" font-family="sans-serif" font-size="11" fill="#10b981">142ms · 840 tokens</text>

      <rect x="15" y="55" width="445" height="110" rx="8" fill="#1f1433" stroke="#4c1d95" stroke-width="1" />
      <text x="30" y="80" font-family="sans-serif" font-size="11" fill="#c084fc" font-weight="bold">PROMPT INPUT [SYSTEM + USER]</text>
      <text x="30" y="105" font-family="monospace" font-size="11" fill="#e2e8f0">Synthesize benchmark telemetry metrics into a</text>
      <text x="30" y="125" font-family="monospace" font-size="11" fill="#e2e8f0">production incident postmortem with root-cause analysis...</text>

      <!-- Model Output Bubble -->
      <rect x="15" y="180" width="445" height="265" rx="8" fill="#180e2a" stroke="#2e1065" stroke-width="1" />
      <text x="30" y="210" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f43f5e">AI Generated Postmortem Preview</text>
      <text x="30" y="235" font-family="sans-serif" font-size="11" fill="#cbd5e1">1. Summary: A cascading cache stampede triggered</text>
      <text x="30" y="255" font-family="sans-serif" font-size="11" fill="#cbd5e1">   connection starvation on the primary read-replica.</text>
      <text x="30" y="280" font-family="sans-serif" font-size="11" fill="#cbd5e1">2. Root Cause: TTL expiry aligned across 40k keys</text>
      <text x="30" y="300" font-family="sans-serif" font-size="11" fill="#cbd5e1">   simultaneously without jitter randomization.</text>
      
      <rect x="30" y="325" width="415" height="90" rx="6" fill="#0d0718" />
      <text x="45" y="355" font-family="monospace" font-size="10" fill="#38bdf8">// Mitigation: Add probabilistic early expiration</text>
      <text x="45" y="375" font-family="monospace" font-size="10" fill="#a855f7">const jitter = Math.random() * 0.2;</text>
      <text x="45" y="395" font-family="monospace" font-size="10" fill="#a855f7">return ttl * (0.9 + jitter);</text>
    </g>

    <!-- Split Screen Right Model (GPT-4o) -->
    <g transform="translate(535, 75)">
      <rect width="475" height="470" rx="10" fill="#120c1d" stroke="#3b1d5a" stroke-width="1" />
      <rect x="15" y="15" width="110" height="26" rx="6" fill="#0369a1" fill-opacity="0.3" stroke="#0ea5e9" stroke-width="1" />
      <text x="25" y="32" font-family="sans-serif" font-size="12" font-weight="bold" fill="#bae6fd">GPT-4o</text>
      <text x="450" y="32" text-anchor="end" font-family="sans-serif" font-size="11" fill="#10b981">190ms · 912 tokens</text>

      <rect x="15" y="55" width="445" height="110" rx="8" fill="#1f1433" stroke="#4c1d95" stroke-width="1" />
      <text x="30" y="80" font-family="sans-serif" font-size="11" fill="#38bdf8" font-weight="bold">EVALUATION METRICS</text>
      <text x="30" y="105" font-family="sans-serif" font-size="11" fill="#e2e8f0">Semantic Match Score: <tspan fill="#10b981" font-weight="bold">98.4%</tspan></text>
      <text x="30" y="125" font-family="sans-serif" font-size="11" fill="#e2e8f0">Hallucination Risk Index: <tspan fill="#10b981" font-weight="bold">0.02 (Low)</tspan></text>
      <text x="30" y="145" font-family="sans-serif" font-size="11" fill="#e2e8f0">Token Efficiency Score: <tspan fill="#f59e0b" font-weight="bold">8.9/10</tspan></text>

      <!-- Output stats comparison -->
      <rect x="15" y="180" width="445" height="265" rx="8" fill="#180e2a" stroke="#2e1065" stroke-width="1" />
      <text x="30" y="210" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">Chain Optimization Delta</text>
      
      <!-- Comparison bars -->
      <text x="30" y="245" font-family="sans-serif" font-size="11" fill="#cbd5e1">Prompt Compression</text>
      <rect x="30" y="255" width="415" height="14" rx="7" fill="#0d0718" />
      <rect x="30" y="255" width="310" height="14" rx="7" fill="#8b5cf6" />

      <text x="30" y="300" font-family="sans-serif" font-size="11" fill="#cbd5e1">Response Latency (TTFT)</text>
      <rect x="30" y="310" width="415" height="14" rx="7" fill="#0d0718" />
      <rect x="30" y="310" width="180" height="14" rx="7" fill="#06b6d4" />

      <text x="30" y="355" font-family="sans-serif" font-size="11" fill="#cbd5e1">Cost Per 1,000 Executions</text>
      <rect x="30" y="365" width="415" height="14" rx="7" fill="#0d0718" />
      <rect x="30" y="365" width="110" height="14" rx="7" fill="#10b981" />
      <text x="30" y="410" font-family="sans-serif" font-size="11" fill="#10b981" font-weight="bold">✓ $0.42 saved per run vs uncompressed prompt</text>
    </g>
  </g>
</svg>
