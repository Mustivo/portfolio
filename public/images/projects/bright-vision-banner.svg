          <text x="660" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">STATUS</text>

          <!-- Row 1 -->
          <line x1="0" y1="78" x2="770" y2="78" stroke="#1f2c40" stroke-width="1" />
          <text x="20" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Computer Fundamentals &amp; Digital Literacy</text>
          <text x="320" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#cbd5e1">Mwizerwa Steven</text>
          <text x="500" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">65 Enrolled</text>
          <rect x="654" y="48" width="70" height="20" rx="4" fill="#064e3b" />
          <text x="668" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#34d399">Ongoing</text>

          <!-- Row 2 -->
          <line x1="0" y1="120" x2="770" y2="120" stroke="#1f2c40" stroke-width="1" />
          <text x="20" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Web Development &amp; Frontend Essentials</text>
          <text x="320" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#cbd5e1">Mwizerwa Steven</text>
          <text x="500" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">52 Enrolled</text>
          <rect x="654" y="90" width="70" height="20" rx="4" fill="#064e3b" />
          <text x="668" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#34d399">Ongoing</text>

          <!-- Row 3 -->
          <line x1="0" y1="162" x2="770" y2="162" stroke="#1f2c40" stroke-width="1" />
          <text x="20" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Practical Programming &amp; Problem Solving</text>
          <text x="320" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#cbd5e1">Instructor Team</text>
          <text x="500" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">48 Enrolled</text>
          <rect x="654" y="132" width="70" height="20" rx="4" fill="#1e3a5f" />
          <text x="668" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#60a5fa">In Progress</text>

          <!-- Row 4 -->
          <text x="20" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">IT Hardware &amp; Network Diagnostics</text>
          <text x="320" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#cbd5e1">Engineering Staff</text>
          <text x="500" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">40 Enrolled</text>
          <rect x="654" y="174" width="70" height="20" rx="4" fill="#4c1d95" />
          <text x="666" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#c084fc">Lab Week</text>
