        <g transform="translate(0, 142)">
          <rect width="770" height="210" rx="12" fill="#141d2d" stroke="#233045" stroke-width="1" />

          <!-- Table Header -->
          <rect width="770" height="36" rx="12" fill="#1a263a" />
          <path d="M 0 24 L 770 24 L 770 36 L 0 36 Z" fill="#1a263a" />
