<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="primary-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="accent-indigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow-ambient" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bg-grad)" />

  <!-- Background Ambient Glow -->
  <circle cx="200" cy="180" r="160" fill="#f59e0b" opacity="0.12" filter="url(#glow-ambient)" />
  <circle cx="1020" cy="520" r="180" fill="#6366f1" opacity="0.14" filter="url(#glow-ambient)" />

  <!-- Grid lines -->
  <g opacity="0.08" stroke="#94a3b8" stroke-width="1">
    <line x1="120" y1="0" x2="120" y2="700" />
    <line x1="360" y1="0" x2="360" y2="700" />
    <line x1="600" y1="0" x2="600" y2="700" />
    <line x1="840" y1="0" x2="840" y2="700" />
    <line x1="1080" y1="0" x2="1080" y2="700" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="560" x2="1200" y2="560" />
  </g>

  <!-- Main Application Window -->
  <g transform="translate(80, 50)">
    <!-- Browser Card Outer -->
    <rect width="1040" height="600" rx="16" fill="#131c2e" stroke="#2a374f" stroke-width="1.5" />

    <!-- Window Top Header Bar -->
    <path d="M 0 16 C 0 7.163 7.163 0 16 0 L 1024 0 C 1032.837 0 1040 7.163 1040 16 L 1040 48 L 0 48 Z" fill="#0b1120" />
    <circle cx="28" cy="24" r="5" fill="#ef4444" />
    <circle cx="46" cy="24" r="5" fill="#f59e0b" />
    <circle cx="64" cy="24" r="5" fill="#10b981" />

    <!-- URL Bar -->
    <rect x="110" y="13" width="460" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="130" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">https://portal.brightvision.rw/dashboard</text>

    <!-- Top Navigation Inside App -->
    <g transform="translate(0, 48)">
      <rect width="1040" height="54" fill="#0f172a" border="none" />
      <line x1="0" y1="54" x2="1040" y2="54" stroke="#1e293b" stroke-width="1" />

      <!-- Logo & Brand Title -->
      <rect x="24" y="12" width="30" height="30" rx="8" fill="url(#primary-amber)" />
      <path d="M 32 30 L 39 18 L 46 30 Z" fill="#ffffff" />
      <text x="66" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">BRIGHT VISION</text>
      <text x="180" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#f59e0b" font-weight="600">TRAINING CENTER</text>

