<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="36" fill="url(#bg)" stroke="#334155" stroke-width="2" />

  <!-- Ambient Glow -->
  <circle cx="250" cy="220" r="140" fill="#f59e0b" opacity="0.16" filter="url(#logo-glow)" />
  <circle cx="250" cy="260" r="120" fill="#6366f1" opacity="0.14" filter="url(#logo-glow)" />

  <!-- Geometric Emblem: Hexagon Shield & Sunrays/Vision -->
  <g transform="translate(130, 90)">
    <!-- Shield/Base -->
    <polygon points="120,10 230,70 230,190 120,250 10,190 10,70" fill="#131c2e" stroke="url(#brand-grad)" stroke-width="6" />

    <!-- Vision / Prism Lines -->
    <path d="M 120 40 L 195 90 L 195 170 L 120 220 L 45 170 L 45 90 Z" fill="#1e293b" opacity="0.8" />
    <path d="M 120 60 L 120 200" stroke="url(#blue-grad)" stroke-width="4" stroke-linecap="round" />
    <path d="M 60 130 L 180 130" stroke="url(#blue-grad)" stroke-width="4" stroke-linecap="round" />

    <!-- Center Glowing Core / Star of Knowledge -->
    <circle cx="120" cy="130" r="26" fill="url(#brand-grad)" />
    <circle cx="120" cy="130" r="12" fill="#ffffff" />
  </g>

  <!-- Typography -->
  <text x="250" y="390" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="2">BRIGHT VISION</text>
  <text x="250" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f59e0b" letter-spacing="4">TRAINING CENTER</text>
  <text x="250" y="445" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" letter-spacing="1">RWANDA</text>
</svg>
