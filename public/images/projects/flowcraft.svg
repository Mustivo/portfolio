<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bg-flow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e29" />
      <stop offset="50%" stop-color="#2a1545" />
      <stop offset="100%" stop-color="#130824" />
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#bg-flow)" />

  <g transform="translate(80, 60)">
    <rect width="1040" height="580" rx="16" fill="#1c0f33" stroke="#7c3aed" stroke-width="1.5" />
    
    <!-- Top Bar -->
    <path d="M 0 16 C 0 7.163 7.163 0 16 0 L 1024 0 C 1032.837 0 1040 7.163 1040 16 L 1040 50 L 0 50 Z" fill="#120822" />
    <circle cx="30" cy="25" r="6" fill="#ef4444" />
    <circle cx="50" cy="25" r="6" fill="#f59e0b" />
    <circle cx="70" cy="25" r="6" fill="#10b981" />
    <rect x="120" y="14" width="380" height="22" rx="6" fill="#2d1650" stroke="#6d28d9" stroke-width="1" />
    <text x="140" y="29" font-family="sans-serif" font-size="11" fill="#ddd6fe">https://flowcraft.studio/dag/webhook-alert-pipeline</text>
    
    <rect x="910" y="14" width="100" height="24" rx="6" fill="#7c3aed" />
    <text x="960" y="30" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fdf4ff">▶ Test Run</text>

    <!-- Node Canvas Area with Dot Grid -->
    <g transform="translate(30, 70)">
      <rect width="980" height="470" rx="12" fill="#130822" stroke="#3b1b68" stroke-width="1" />

      <!-- Bezier Connectors -->
      <path d="M 230 150 C 300 150, 300 240, 370 240" fill="none" stroke="#a855f7" stroke-width="3" />
      <path d="M 570 240 C 640 240, 640 160, 710 160" fill="none" stroke="#a855f7" stroke-width="3" />
      <path d="M 570 240 C 640 240, 640 340, 710 340" fill="none" stroke="#a855f7" stroke-width="3" />

      <!-- Node 1: Webhook Trigger -->
      <g transform="translate(50, 90)">
        <rect width="180" height="120" rx="10" fill="#241142" stroke="#a855f7" stroke-width="1.5" />
        <rect width="180" height="30" rx="10" fill="#3b1a6b" />
        <text x="15" y="20" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f5d0fe">⚡ Webhook Listener</text>
        <text x="15" y="55" font-family="sans-serif" font-size="11" fill="#e9d5ff">POST /api/v1/inbound</text>
        <text x="15" y="75" font-family="sans-serif" font-size="10" fill="#a855f7">Auth: Bearer Token</text>
        <circle cx="180" cy="60" r="6" fill="#a855f7" />
      </g>

      <!-- Node 2: Data Transform Filter -->
      <g transform="translate(370, 180)">
        <rect width="200" height="120" rx="10" fill="#241142" stroke="#a855f7" stroke-width="1.5" />
        <rect width="200" height="30" rx="10" fill="#3b1a6b" />
        <text x="15" y="20" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f5d0fe">⚙ JSON Transform DAG</text>
        <circle cx="0" cy="60" r="6" fill="#a855f7" />
        <text x="15" y="55" font-family="sans-serif" font-size="10" fill="#e9d5ff">Filter: payload.priority == "high"</text>
        <text x="15" y="75" font-family="sans-serif" font-size="10" fill="#e9d5ff">Enrich: add geo_ip &amp; timestamp</text>
        <circle cx="200" cy="60" r="6" fill="#a855f7" />
      </g>

      <!-- Node 3A: Slack Notification -->
      <g transform="translate(710, 100)">
        <rect width="200" height="120" rx="10" fill="#241142" stroke="#22c55e" stroke-width="1.5" />
        <rect width="200" height="30" rx="10" fill="#14532d" />
        <text x="15" y="20" font-family="sans-serif" font-size="11" font-weight="bold" fill="#bbf7d0">💬 Slack Channel Dispatch</text>
        <circle cx="0" cy="60" r="6" fill="#a855f7" />
        <text x="15" y="55" font-family="sans-serif" font-size="10" fill="#dcfce7">Channel: #incident-alerts</text>
        <text x="15" y="75" font-family="sans-serif" font-size="10" fill="#22c55e">Status: 200 OK (84ms)</text>
      </g>

      <!-- Node 3B: Database Persistence -->
      <g transform="translate(710, 280)">
        <rect width="200" height="120" rx="10" fill="#241142" stroke="#3b82f6" stroke-width="1.5" />
        <rect width="200" height="30" rx="10" fill="#1e3a8a" />
        <text x="15" y="20" font-family="sans-serif" font-size="11" font-weight="bold" fill="#bfdbfe">🗄️ PostgreSQL Sync</text>
        <circle cx="0" cy="60" r="6" fill="#a855f7" />
        <text x="15" y="55" font-family="sans-serif" font-size="10" fill="#dbeafe">Table: audit_incidents</text>
        <text x="15" y="75" font-family="sans-serif" font-size="10" fill="#60a5fa">Rows inserted: 1</text>
      </g>
    </g>
  </g>
</svg>
