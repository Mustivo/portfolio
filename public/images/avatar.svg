<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="avatar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Circle with Gradient -->
  <circle cx="200" cy="200" r="190" fill="url(#avatar-bg)" />
  <circle cx="200" cy="200" r="184" fill="#0f172a" />

  <!-- Code/Tech subtle background pattern -->
  <text x="70" y="100" font-family="monospace" font-size="20" fill="#38bdf8" opacity="0.3">&lt;dev&gt;</text>
  <text x="270" y="120" font-family="monospace" font-size="18" fill="#c084fc" opacity="0.3">&#123;code&#125;</text>
  <text x="60" y="320" font-family="monospace" font-size="16" fill="#34d399" opacity="0.3">=&gt; async</text>

  <!-- Body / Shoulders -->
  <path d="M 90 380 C 100 290, 150 260, 200 260 C 250 260, 300 290, 310 380 Z" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <!-- Hoodie / Collar -->
  <path d="M 160 260 C 180 290, 220 290, 240 260 Z" fill="#3b82f6" opacity="0.9" />

  <!-- Neck -->
  <rect x="175" y="210" width="50" height="60" rx="10" fill="url(#skin)" />

  <!-- Head -->
  <ellipse cx="200" cy="180" rx="65" ry="75" fill="url(#skin)" filter="url(#shadow)" />

  <!-- Modern Hair -->
  <path d="M 130 170 C 130 110, 160 90, 200 90 C 240 90, 275 110, 270 170 C 255 130, 230 120, 200 120 C 160 120, 140 145, 130 170 Z" fill="#18181b" />

  <!-- Glasses -->
  <rect x="150" y="160" width="42" height="28" rx="8" fill="none" stroke="#0ea5e9" stroke-width="4" />
  <rect x="208" y="160" width="42" height="28" rx="8" fill="none" stroke="#0ea5e9" stroke-width="4" />
  <line x1="192" y1="174" x2="208" y2="174" stroke="#0ea5e9" stroke-width="4" />

  <!-- Smile -->
  <path d="M 185 215 Q 200 228 215 215" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round" />

  <!-- Tech Lapel Pin -->
  <circle cx="250" cy="310" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
  <text x="250" y="315" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8">TS</text>
</svg>
